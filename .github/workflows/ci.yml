name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  quality:
    name: Analyze, format & test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # Yerel geliştirme ortamıyla aynı sürümde tutulur ki CI,
          # stable kanalındaki yeni deprekasyon uyarılarıyla sürpriz
          # yapmasın. Yükseltirken bu değeri de güncelle.
          flutter-version: '3.44.8'
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

      - name: Run tests
        run: flutter test
